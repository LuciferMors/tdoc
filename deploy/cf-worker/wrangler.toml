name = "tdoc-api-proxy"
main = "src/worker.js"
compatibility_date = "2026-04-01"

# Bind the Worker to api.tdoc.xyz as a Cloudflare Custom Domain.
#
# `custom_domain = true` makes wrangler auto-create the DNS record AND
# provision a TLS certificate for the hostname — no dashboard clicks.
# With `pattern = "api.tdoc.xyz"` (no wildcard), EVERY request to this
# hostname routes to the Worker, which does its own internal path gating.
[[routes]]
pattern = "api.tdoc.xyz"
custom_domain = true

# Observability — free tier, includes real-time logs (`wrangler tail`).
[observability]
enabled = true

# No KV / R2 / D1 bindings — we're purely a stateless proxy today.
# Add them here when we front the HF Space with caching or edge-side rate limiting.
