name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-hf
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run on the canonical repo — forks don't have HF_TOKEN and
    # shouldn't try to push to a Space they don't own. GitHub Actions
    # does NOT allow `secrets` context in job-level `if:`; `github.repository`
    # is the safe alternative.
    if: github.repository == 'LuciferMors/tdoc'

    steps:
      - name: Verify HF_TOKEN secret is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is not set. Add it at"
            echo "::error::https://github.com/LuciferMors/tdoc/settings/secrets/actions"
            exit 1
          fi
          echo "HF_TOKEN present (${#HF_TOKEN} chars)"

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Stage HF-specific Space README
        # HF Spaces require a README.md with YAML front-matter at the repo root.
        # Our project README is Markdown without front-matter; we need to swap
        # it for the HF-specific one under deploy/huggingface/ before pushing.
        run: |
          set -euo pipefail
          cp deploy/huggingface/README.md README.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "hf: apply Space README front-matter"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: LuciferMors
          HF_SPACE: tdoc
        run: |
          set -euo pipefail
          git remote add hf "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE}"
          # Force push because we rewrite the README on every sync; the HF Space
          # is a mirror, not an independent branch.
          git push --force hf HEAD:main
