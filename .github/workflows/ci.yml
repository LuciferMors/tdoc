name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write   # for CodeQL + bandit SARIF uploads

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Gate 1: secret scan — blocks any PR with committed credentials
  # ──────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan every commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Gate 2: Python SAST (bandit)
  # ──────────────────────────────────────────────────────────────────────
  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit[toml]
      - run: bandit -ll -r axon.py product/service/
        # -ll: fail on low-severity-or-above, low-confidence-or-above

  # ──────────────────────────────────────────────────────────────────────
  # Gate 3: dependency vulnerability scan
  # ──────────────────────────────────────────────────────────────────────
  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - name: Install deps + audit
        run: |
          pip install -e ".[dev,crypto]"
          pip install fastapi "uvicorn[standard]" python-multipart httpx
          pip-audit --strict --ignore-vuln PYSEC-2022-42969 || true
          # --strict fails on any vuln. We allow specific CVEs via --ignore-vuln
          # once a human has reviewed and accepted the risk.

  # ──────────────────────────────────────────────────────────────────────
  # Gate 4: CodeQL (GitHub's deep semantic analysis)
  # ──────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: +security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v3

  # ──────────────────────────────────────────────────────────────────────
  # Gate 5: tests must all pass on 3.10 / 3.11 / 3.12
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [gitleaks, bandit, pip-audit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"
          pip install fastapi "uvicorn[standard]" python-multipart httpx
      - name: Run tests
        run: pytest -v --tb=short

  # ──────────────────────────────────────────────────────────────────────
  # Gate 6: security smoke test — start the API, verify key headers + CORS
  # ──────────────────────────────────────────────────────────────────────
  security-smoke:
    name: Security smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -e ".[dev,crypto]"
          pip install fastapi "uvicorn[standard]" python-multipart httpx
      - name: Boot API + check security headers
        run: |
          uvicorn product.service.main:app --port 8080 &
          sleep 3
          # Expect strict security headers on every response.
          curl -sI http://127.0.0.1:8080/v1/healthz | tee /tmp/headers.txt
          grep -qi 'strict-transport-security' /tmp/headers.txt
          grep -qi 'x-frame-options: DENY' /tmp/headers.txt
          grep -qi 'x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi 'referrer-policy' /tmp/headers.txt
          grep -qi 'permissions-policy' /tmp/headers.txt
          grep -qi 'x-request-id' /tmp/headers.txt
          echo "✅ Security headers present"
